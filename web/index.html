<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mind Tiles — flip, remember and match symbol tiles.">
  <title>Mind Tiles</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- YouTube Playables SDK: MUST load before any game code (Integration 1).
       Locally (outside YouTube) the SDK runs as a no-op. -->
  <script src="https://www.youtube.com/game_api/v1"></script>

  <!-- NOTE: deliberately no base-href element: Playables requires relative paths. -->
  <style>
    html, body { margin: 0; height: 100%; background: #1c1040; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(180deg, #5530a8 0%, #34196f 45%, #1c1040 100%);
      color: #ffcd29; font: 800 28px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 1px;
    }
    #loading .tiles { display: flex; gap: 8px; }
    #loading .tile {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(180deg, #ffe27a, #ffcd29); box-shadow: 0 4px 0 #cf8e00;
      animation: flip 1.2s ease-in-out infinite;
    }
    #loading .tile:nth-child(2) { animation-delay: .15s; }
    #loading .tile:nth-child(3) { animation-delay: .3s; }
    #loading .tile:nth-child(4) { animation-delay: .45s; }
    #loading .label { font-size: 15px; color: #d9d0f5; font-weight: 600; letter-spacing: 0; }
    @keyframes flip { 0%, 60%, 100% { transform: scaleX(1); } 30% { transform: scaleX(0.1); } }
    @media (prefers-reduced-motion: reduce) { #loading .tile { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="tiles" aria-hidden="true"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
    <div>MIND TILES</div>
    <div class="label">Loading…</div>
  </div>
  <script>
    // Integration 2a: firstFrameReady is called while the loading screen
    // above is visible. gameReady is called from Dart (lib/main_playables.dart)
    // once the home screen is interactive and this loader has been removed.
    try {
      if (typeof ytgame !== 'undefined') { ytgame.game.firstFrameReady(); }
    } catch (e) { /* SDK unavailable: local run */ }
    window.mindTilesHideLoader = function () {
      var el = document.getElementById('loading');
      if (el && el.parentNode) { el.parentNode.removeChild(el); }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
